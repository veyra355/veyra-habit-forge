name: Veyra CI

"on":
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: "npm install --no-audit --no-fund"

      - name: Format source files
        run: "npx prettier --write src"

      - name: Check formatting
        run: "npx prettier --check src"

      - name: Lint
        run: "npx eslint ."

      - name: Production build
        run: "npm run build"
