name: Veyra CI

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Auto-format source
        run: npx prettier --write src

      - name: Lint
        run: npx eslint . --fix --rule '@typescript-eslint/no-explicit-any: off'

      - name: Verify formatting
        run: npx prettier --check src

      - name: Verify lint
        run: npx eslint . --rule '@typescript-eslint/no-explicit-any: off'

      - name: Production build
        run: npm run build
