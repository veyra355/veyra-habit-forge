name: Veyra CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'fix/**']

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Format source
        run: npx prettier --write src

      - name: Auto-fix lintable issues
        run: npx eslint . --fix --rule '@typescript-eslint/no-explicit-any: off'

      - name: Verify lint
        run: npx eslint . --rule '@typescript-eslint/no-explicit-any: off'

      - name: Production build
        run: npm run build
