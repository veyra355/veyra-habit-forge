name: Veyra CI

# Re-registered to force GitHub to re-parse triggers (workflow_dispatch was not
# recognized by the Actions API even though it was present in the file).
on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feature/**'
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check formatting
        run: npx prettier --check src

      - name: Lint
        run: "npx eslint . --rule '@typescript-eslint/no-explicit-any: off'"

      - name: Production build
        run: npm run build
