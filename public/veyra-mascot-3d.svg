<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" role="img" aria-label="Veyra warrior mascot">
<defs>
 <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0b38a"/><stop offset=".5" stop-color="#a95736"/><stop offset="1" stop-color="#51261e"/></linearGradient>
 <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".45" stop-color="#bfc8d2"/><stop offset="1" stop-color="#65717d"/></linearGradient>
 <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#30343b"/><stop offset=".45" stop-color="#090b0f"/><stop offset="1" stop-color="#4b1115"/></linearGradient>
 <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff454f"/><stop offset=".5" stop-color="#b30f1b"/><stop offset="1" stop-color="#45070c"/></linearGradient>
 <filter id="shadow"><feGaussianBlur stdDeviation="9"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<ellipse cx="218" cy="486" rx="145" ry="22" fill="#000" opacity=".55" filter="url(#shadow)"/>
