<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .pose-line { fill: none; stroke: #2563EB; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .pose-fill { fill: #2563EB; }
      .pose-ghost { fill: none; stroke: #64748B; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 2 6; opacity: 0.5; }
      .pose-label { fill: #94A3B8; font-family: Inter, sans-serif; font-size: 13px; font-weight: 600; }
      .weight { fill: #06B6D4; }
      .floor { stroke: #334155; stroke-width: 2; }
    </style>
  </defs>

  <g transform="translate(80,25)">
    <line class="floor" x1="-20" y1="150" x2="180" y2="150" />
    <!-- hinged torso -->
    <circle class="pose-fill" cx="20" cy="30" r="11" />
    <path class="pose-line" d="M25 40 L90 80" />
    <!-- support arm -->
    <path class="pose-line" d="M60 55 L100 60 L100 150" />
    <!-- legs -->
    <path class="pose-line" d="M90 80 L85 150" />
    <path class="pose-line" d="M90 80 L120 150" />
    <!-- pulling arm + dumbbell -->
    <path class="pose-line" d="M45 55 L15 90" />
    <rect class="weight" x="0" y="85" width="18" height="12" rx="3" />
    <text class="pose-label" x="0" y="180">FLAT BACK — PULL TO HIP</text>
  </g>
</svg>
