<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .pose-line { fill: none; stroke: #2563EB; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .pose-fill { fill: #2563EB; }
      .pose-ghost { fill: none; stroke: #64748B; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 2 6; opacity: 0.5; }
      .pose-label { fill: #94A3B8; font-family: Inter, sans-serif; font-size: 13px; font-weight: 600; }
      .pose-arrow { fill: none; stroke: #06B6D4; stroke-width: 2.5; stroke-linecap: round; }
      .floor { stroke: #334155; stroke-width: 2; }
    </style>
  </defs>

  <!-- Frame 1: top position (ghost) -->
  <g transform="translate(20,40)">
    <line class="floor" x1="0" y1="140" x2="120" y2="140" />
    <circle class="pose-ghost" cx="100" cy="60" r="11" />
    <path class="pose-ghost" d="M92 68 L20 130" />
    <path class="pose-ghost" d="M60 95 L60 140" />
    <path class="pose-ghost" d="M75 100 L100 130" />
    <text class="pose-label" x="10" y="175">TOP — arms locked</text>
  </g>

  <path class="pose-arrow" d="M155 110 L185 110" marker-end="url(#arrowhead2)" />
  <defs>
    <marker id="arrowhead2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#06B6D4" />
    </marker>
  </defs>

  <!-- Frame 2: bottom position (solid) -->
  <g transform="translate(190,40)">
    <line class="floor" x1="0" y1="140" x2="120" y2="140" />
    <circle class="pose-fill" cx="105" cy="95" r="11" />
    <path class="pose-line" d="M96 100 L20 130" />
    <path class="pose-line" d="M60 100 L60 140" />
    <path class="pose-line" d="M70 108 L35 90 M70 108 L108 100" />
    <text class="pose-label" x="0" y="175">BOTTOM — elbows ~45°</text>
  </g>
</svg>
