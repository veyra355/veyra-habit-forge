<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .pose-line { fill: none; stroke: #2563EB; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .pose-fill { fill: #2563EB; }
      .pose-ghost { fill: none; stroke: #64748B; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 2 6; opacity: 0.5; }
      .pose-label { fill: #94A3B8; font-family: Inter, sans-serif; font-size: 13px; font-weight: 600; }
      .pose-arrow { fill: none; stroke: #06B6D4; stroke-width: 2.5; stroke-linecap: round; }
    </style>
  </defs>

  <!-- Frame 1: standing (ghost) -->
  <g transform="translate(60,20)">
    <circle class="pose-ghost" cx="40" cy="20" r="12" />
    <path class="pose-ghost" d="M40 32 L40 90" />
    <path class="pose-ghost" d="M40 45 L15 70 M40 45 L65 70" />
    <path class="pose-ghost" d="M40 90 L20 150 M40 90 L60 150" />
    <text class="pose-label" x="10" y="180">START</text>
  </g>

  <!-- Arrow -->
  <path class="pose-arrow" d="M155 100 L185 100" marker-end="url(#arrowhead)" />
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#06B6D4" />
    </marker>
  </defs>

  <!-- Frame 2: squat (solid) -->
  <g transform="translate(200,20)">
    <circle class="pose-fill" cx="40" cy="35" r="12" />
    <path class="pose-line" d="M40 47 L40 90" />
    <path class="pose-line" d="M40 55 L15 80 M40 55 L65 80" />
    <path class="pose-line" d="M40 90 L15 100 L15 150" />
    <path class="pose-line" d="M40 90 L65 100 L65 150" />
    <path class="pose-ghost" d="M0 155 L90 155" />
    <text class="pose-label" x="10" y="180">HIPS BACK, CHEST TALL</text>
  </g>
</svg>
